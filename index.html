<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duka — Shop Ledger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Duka</h1>
    <p class="subtitle">Track sales and stock, even when you're not there.</p>

    <!-- SIGN IN FORM -->
    <div id="signin-form">
      <h2>Sign In</h2>
      <input type="email" id="login-email" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Password" />
      <button id="login-btn">Sign In</button>
      <p class="toggle-link">New here? <a href="#" id="show-signup">Create an account</a></p>
    </div>

    <!-- SIGN UP FORM -->
    <div id="signup-form" style="display:none;">
      <h2>Create Account</h2>
      <input type="text" id="signup-name" placeholder="Full Name" />
      <input type="email" id="signup-email" placeholder="Email" />
      <input type="password" id="signup-password" placeholder="Password (min 6 chars)" />
      <select id="signup-role">
        <option value="owner">Shop Owner</option>
        <option value="keeper">Shop Keeper</option>
      </select>
      <button id="signup-btn">Sign Up</button>
      <p class="toggle-link">Already have an account? <a href="#" id="show-signin">Sign In</a></p>
    </div>

    <div id="error-msg" class="error" style="display:none;"></div>
  </div>

  <!-- Load Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Your config -->
  <script src="supabaseClient.js"></script>

  <!-- Page logic -->
  <script>
    // DOM refs
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const errorMsg = document.getElementById('error-msg');

    // Show sign-up form
    document.getElementById('show-signup').addEventListener('click', (e) => {
      e.preventDefault();
      signinForm.style.display = 'none';
      signupForm.style.display = 'block';
      errorMsg.style.display = 'none';
    });

    // Show sign-in form
    document.getElementById('show-signin').addEventListener('click', (e) => {
      e.preventDefault();
      signupForm.style.display = 'none';
      signinForm.style.display = 'block';
      errorMsg.style.display = 'none';
    });

    // Sign Up
    document.getElementById('signup-btn').addEventListener('click', async () => {
      const fullName = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const role = document.getElementById('signup-role').value;

      if (!fullName || !email || !password) {
        showError('Please fill in all fields.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      try {
        // 1. Sign up with Supabase Auth
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName, role: role }
          }
        });

        if (error) throw error;

        // 2. Create a profile record (if not automatically created via trigger)
        // The schema expects a profiles row, so we insert one.
        const { error: profileError } = await supabase
          .from('profiles')
          .insert([{
            id: data.user.id,
            full_name: fullName,
            role: role,
            owner_id: role === 'keeper' ? null : null // keeper must be assigned later by owner
          }]);

        if (profileError) throw profileError;

        // Redirect based on role
        if (role === 'owner') {
          window.location.href = 'owner.html';
        } else {
          window.location.href = 'keeper.html';
        }
      } catch (err) {
        showError(err.message || 'Sign-up failed. Please try again.');
      }
    });

    // Sign In
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('Please enter email and password.');
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });
        if (error) throw error;

        // Fetch profile to know role
        const { data: profile, error: pError } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        if (pError) throw pError;

        if (profile.role === 'owner') {
          window.location.href = 'owner.html';
        } else {
          window.location.href = 'keeper.html';
        }
      } catch (err) {
        showError(err.message || 'Login failed. Check your credentials.');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
