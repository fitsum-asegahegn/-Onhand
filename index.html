<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onhand — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="screen">
  <div style="text-align:center; margin:40px 0 30px;">
    <div class="brand" style="font-size:28px;">On<span style="color:#2563eb;">hand</span></div>
    <p style="font-size:12px; color:var(--ink-soft); margin-top:4px;">በእጄ — In your hand</p>
    <p class="hint" style="margin-top:6px;">Track sales and stock, even when you're not there.</p>
  </div>

  <div id="errorBox" style="background:#fee; color:#b00; padding:10px; border-radius:8px; margin-bottom:10px; display:none;"></div>

  <!-- Sign In Form -->
  <div class="tag-card" id="signInCard">
    <h2 class="section-title" style="margin-top:0;">Sign In</h2>
    <div class="field">
      <label for="siEmail">Email</label>
      <input type="email" id="siEmail" autocomplete="email">
    </div>
    <div class="field">
      <label for="siPassword">Password</label>
      <input type="password" id="siPassword" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="signInBtn">Sign In</button>
  </div>

  <p style="text-align:center; margin:22px 0;">
    <button class="btn-link" id="toggleSignup">New here? Create an account</button>
  </p>

  <!-- Sign Up Form -->
  <div class="tag-card" id="signUpCard" style="display:none;">
    <h2 class="section-title" style="margin-top:0;">Create Account</h2>
    <fieldset style="border:1px solid #ddd; border-radius:8px; padding:12px 14px; margin-bottom:16px;">
      <legend style="font-size:11px; text-transform:uppercase;">I am a...</legend>
      <label><input type="radio" name="signupRole" value="owner" checked> Shop owner</label><br>
      <label><input type="radio" name="signupRole" value="keeper"> Keeper</label>
    </fieldset>
    <div class="field">
      <label for="suName">Your name</label>
      <input type="text" id="suName">
    </div>
    <div class="field" id="shopCodeField" style="display:none;">
      <label for="suShopCode">Shop code</label>
      <input type="text" id="suShopCode" placeholder="Ask the owner">
    </div>
    <div class="field">
      <label for="suEmail">Email</label>
      <input type="email" id="suEmail" autocomplete="email">
    </div>
    <div class="field">
      <label for="suPassword">Password</label>
      <input type="password" id="suPassword" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="signUpBtn">Create Account</button>
    <p id="suError" style="color:red; margin-top:10px; display:none;"></p>
  </div>
</div>

<script src="supabaseClient.js"></script>
<script>
  (function() {
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
    }

    // Toggle sign-up
    document.getElementById('toggleSignup').addEventListener('click', function() {
      const showing = document.getElementById('signUpCard').style.display !== 'none';
      document.getElementById('signUpCard').style.display = showing ? 'none' : 'block';
      document.getElementById('signInCard').style.display = showing ? 'block' : 'none';
      this.textContent = showing ? 'New here? Create an account' : 'Already have an account? Sign in';
      hideError();
    });

    // Role toggle
    document.querySelectorAll('input[name="signupRole"]').forEach(el => {
      el.addEventListener('change', function() {
        document.getElementById('shopCodeField').style.display =
          document.querySelector('input[name="signupRole"]:checked').value === 'keeper' ? 'block' : 'none';
      });
    });

    // ===== SIGN IN =====
    document.getElementById('signInBtn').addEventListener('click', async function() {
      const email = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      hideError();
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { showError('Sign-in failed: ' + error.message); return; }
      // After sign-in, redirect to dashboard
      const profile = await getCurrentProfile();
      if (!profile) {
        showError('Signed in but no profile found. Please sign up again.');
        return;
      }
      window.location.href = profile.role === 'owner' ? 'owner.html' : 'keeper.html';
    });

    // ===== SIGN UP =====
    document.getElementById('signUpBtn').addEventListener('click', async function() {
      const role = document.querySelector('input[name="signupRole"]:checked').value;
      const fullName = document.getElementById('suName').value.trim();
      const shopCode = document.getElementById('suShopCode').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      const errEl = document.getElementById('suError');
      errEl.style.display = 'none';
      hideError();

      if (!fullName || !email || !password) {
        errEl.textContent = 'Please fill all fields.';
        errEl.style.display = 'block';
        return;
      }
      if (role === 'keeper' && !shopCode) {
        errEl.textContent = 'Please enter the shop code.';
        errEl.style.display = 'block';
        return;
      }

      try {
        // 1. Sign up
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName, role } }
        });
        if (error) { errEl.textContent = 'Sign-up error: ' + error.message; errEl.style.display = 'block'; return; }

        const userId = data.user?.id;
        if (!userId) {
          errEl.textContent = 'Account created but email confirmation required. Check your email.';
          errEl.style.display = 'block';
          return;
        }

        // 2. Insert profile
        const { error: profileError } = await supabase
          .from('profiles')
          .insert({ id: userId, full_name: fullName, role, owner_id: role === 'keeper' ? shopCode : null });

        if (profileError) {
          errEl.textContent = 'Profile insert failed: ' + profileError.message;
          errEl.style.display = 'block';
          showError('Profile insert error: ' + profileError.message);
          return;
        }

        // 3. Ensure session
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          // Try signing in
          const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
          if (signInError) {
            errEl.textContent = 'Auto-login failed: ' + signInError.message;
            errEl.style.display = 'block';
            return;
          }
        }

        // 4. Redirect
        const profile = await getCurrentProfile();
        if (!profile) {
          showError('Profile exists but could not be fetched. Please try signing in.');
          return;
        }
        window.location.href = profile.role === 'owner' ? 'owner.html' : 'keeper.html';

      } catch (e) {
        errEl.textContent = 'Unexpected error: ' + e.message;
        errEl.style.display = 'block';
        showError('Unexpected: ' + e.message);
      }
    });

    // ===== On load: check session =====
    (async function() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const profile = await getCurrentProfile();
        if (profile) {
          window.location.href = profile.role === 'owner' ? 'owner.html' : 'keeper.html';
        } else {
          // Show a sign-out option
          const div = document.createElement('div');
          div.style.cssText = 'text-align:center; margin-top:20px;';
          div.innerHTML = `
            <p style="color:#b00;">⚠️ Session exists but no profile.</p>
            <button id="forceSignOut" class="btn-primary">Sign Out</button>
          `;
          document.querySelector('.screen').appendChild(div);
          document.getElementById('forceSignOut').addEventListener('click', async function() {
            await supabase.auth.signOut();
            window.location.reload();
          });
        }
      }
    })();
  })();
</script>
</body>
</html>
