<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onhand — Scan & Sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="screen">

  <header style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);">
    <div>
      <div class="brand" style="font-size:26px; font-weight:700;">On<span style="color:#2563eb;">hand</span></div>
      <div style="font-size:10px; color:var(--ink-soft); letter-spacing:0.05em;">በእጄ</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:12px; text-transform:uppercase; color:var(--ink-soft);">Keeper</span>
      <button onclick="signOut()" style="background:none; border:1px solid #ddd; padding:6px 14px; border-radius:6px; font-size:14px; cursor:pointer;">Sign out</button>
    </div>
  </header>

  <button class="scan-button" id="startScanBtn">
    📷 Scan a Product
    <span class="sub">Tap to open the camera</span>
  </button>

  <div id="reader" style="display:none; margin:10px 0;"></div>
  <div id="scanControls" style="display:none; gap:10px; margin-bottom:16px;">
    <button class="btn-secondary" id="stopScanBtn" style="flex:1;">Cancel Scan</button>
    <button class="btn-secondary" id="torchBtn" style="flex:1; display:none;">💡 Torch</button>
  </div>

  <!-- Manual fallback: always available, not just when the camera fails -->
  <div class="tag-card" style="margin-bottom:16px;">
    <span class="tag-label">Or type the code</span>
    <p class="hint" style="margin:2px 0 10px;">Printed on the label under the barcode lines.</p>
    <div style="display:flex; gap:8px;">
      <input type="text" id="manualBarcode" placeholder="e.g. ONHAND738514783" style="flex:1;">
      <button class="btn-primary" id="manualLookupBtn" style="flex:0 0 auto; padding:12px 18px;">Find</button>
    </div>
  </div>

  <div class="tag-card" id="saleCard" style="display:none;">
    <span class="tag-label">Selling</span>
    <div class="tag-value" id="saleProductName" style="font-size:20px;">—</div>
    <div class="tag-sub" id="saleUnitPrice"></div>

    <div class="field" style="margin-top:14px;">
      <label for="saleQty">Quantity</label>
      <input type="number" id="saleQty" min="0.1" step="0.1" value="1">
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" id="cancelSaleBtn" style="flex:1;">Cancel</button>
      <button class="btn-primary" id="confirmSaleBtn" style="flex:1;">Confirm Sale</button>
    </div>
  </div>

  <h2 class="section-title">Item not found?</h2>
  <p class="hint">If a customer asks for something out of stock or not yet in the system, log it — this helps restock the right things.</p>
  <div class="tag-card">
    <div class="field" style="margin-bottom:12px;">
      <label for="missedName">What did they ask for?</label>
      <input type="text" id="missedName" placeholder="e.g. Cooking oil 1L">
    </div>
    <button class="btn-danger-outline" id="logMissedBtn">Log Missed Sale</button>
  </div>

  <div id="toastArea"></div>
</div>

<script src="supabaseClient.js"></script>
<script>
  let profile = null;
  let html5QrCode = null;
  let currentProduct = null;
  let torchOn = false;

  function showToast(msg, isError = false) {
    const area = document.getElementById('toastArea');
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  async function lookupProduct(barcode) {
    try {
      const { data, error } = await supabase
        .from('products')
        .select('id, name, unit, selling_price, current_stock')
        .eq('owner_id', profile.owner_id)
        .eq('barcode', barcode.trim())
        .maybeSingle();
      if (error) throw error;
      return data;
    } catch (e) {
      console.error('lookup error:', e);
      showToast('Error looking up product: ' + e.message, true);
      return null;
    }
  }

  function openSaleCard(product) {
    currentProduct = product;
    document.getElementById('saleProductName').textContent = product.name;
    document.getElementById('saleUnitPrice').textContent =
      `${Math.round(product.selling_price)} Birr per ${product.unit} · ${product.current_stock} in stock`;
    document.getElementById('saleQty').value = 1;
    document.getElementById('saleCard').style.display = 'block';
  }

  function closeSaleCard() {
    currentProduct = null;
    document.getElementById('saleCard').style.display = 'none';
  }

  async function onScanSuccess(decodedText) {
    await stopScanner();
    const product = await lookupProduct(decodedText);
    if (!product) {
      showToast("That barcode isn't in your shop's catalog.", true);
      return;
    }
    openSaleCard(product);
  }

  async function startScanner() {
    try {
      document.getElementById('reader').style.display = 'block';
      document.getElementById('scanControls').style.display = 'flex';
      document.getElementById('startScanBtn').style.display = 'none';

      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ],
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });

      await html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 15,
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const w = Math.floor(Math.min(viewfinderWidth * 0.85, 380));
            return { width: w, height: Math.floor(w * 0.45) };
          }
        },
        onScanSuccess
      );

      try {
        const capabilities = html5QrCode.getRunningTrackCapabilities();
        if (capabilities && capabilities.torch) {
          document.getElementById('torchBtn').style.display = 'block';
        }
      } catch (e) { /* not supported on this device — fine */ }

    } catch (e) {
      showToast("Couldn't open camera. Check permissions.", true);
      await stopScanner();
    }
  }

  document.getElementById('torchBtn').addEventListener('click', async () => {
    if (!html5QrCode) return;
    try {
      torchOn = !torchOn;
      await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
      document.getElementById('torchBtn').textContent = torchOn ? '💡 Torch On' : '💡 Torch';
    } catch (e) {
      showToast('Torch not available on this device.', true);
    }
  });

  async function stopScanner() {
    if (html5QrCode) {
      try {
        await html5QrCode.stop();
        await html5QrCode.clear();
      } catch (e) {}
      html5QrCode = null;
    }
    torchOn = false;
    document.getElementById('reader').style.display = 'none';
    document.getElementById('scanControls').style.display = 'none';
    document.getElementById('torchBtn').style.display = 'none';
    document.getElementById('torchBtn').textContent = '💡 Torch';
    document.getElementById('startScanBtn').style.display = 'block';
  }

  document.getElementById('manualLookupBtn').addEventListener('click', async () => {
    const code = document.getElementById('manualBarcode').value.trim();
    if (!code) { showToast('Enter a barcode number.', true); return; }
    const product = await lookupProduct(code);
    if (!product) { showToast("That barcode isn't in your shop's catalog.", true); return; }
    document.getElementById('manualBarcode').value = '';
    openSaleCard(product);
  });
  document.getElementById('manualBarcode').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('manualLookupBtn').click();
  });

  document.getElementById('startScanBtn').addEventListener('click', startScanner);
  document.getElementById('stopScanBtn').addEventListener('click', stopScanner);
  document.getElementById('cancelSaleBtn').addEventListener('click', closeSaleCard);

  document.getElementById('confirmSaleBtn').addEventListener('click', async () => {
    if (!currentProduct) return;
    const qty = parseFloat(document.getElementById('saleQty').value);
    if (!qty || qty <= 0) {
      showToast('Enter a valid quantity.', true);
      return;
    }

    try {
      const { data: full, error: fetchErr } = await supabase
        .from('products')
        .select('cost_price, selling_price')
        .eq('id', currentProduct.id)
        .single();
      if (fetchErr) throw fetchErr;

      const { error } = await supabase.from('sales').insert({
        owner_id: profile.owner_id,
        product_id: currentProduct.id,
        sold_by: profile.id,
        quantity: qty,
        unit_price_at_sale: full.selling_price,
        cost_price_at_sale: full.cost_price
      });
      if (error) throw error;

      showToast(`✅ Sold ${qty} ${currentProduct.unit} of ${currentProduct.name}`);
      closeSaleCard();
    } catch (e) {
      showToast('Sale failed: ' + e.message, true);
    }
  });

  document.getElementById('logMissedBtn').addEventListener('click', async () => {
    const name = document.getElementById('missedName').value.trim();
    if (!name) {
      showToast('Enter what the customer asked for.', true);
      return;
    }
    try {
      const { error } = await supabase.from('missed_sales').insert({
        owner_id: profile.owner_id,
        product_name_free_text: name,
        reported_by: profile.id
      });
      if (error) throw error;
      document.getElementById('missedName').value = '';
      showToast('📝 Logged — thanks!');
    } catch (e) {
      showToast('Could not log: ' + e.message, true);
    }
  });

  (async () => {
    profile = await requireRole('keeper');
    if (!profile) return;
    if (!profile.owner_id) {
      document.querySelector('.screen').innerHTML = `
        <div style="padding:40px; text-align:center; color:red;">
          <p>⚠️ This keeper account is not linked to a shop.</p>
          <p>Please contact your shop owner for the correct shop code and sign up again.</p>
          <button onclick="signOut()" class="btn-primary" style="margin-top:20px;">Sign out</button>
        </div>
      `;
    }
  })();
</script>
</body>
</html>
