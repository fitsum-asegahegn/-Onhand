<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onhand — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="screen">
  <div style="display:flex; justify-content:flex-end; padding-top:10px;">
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">አማርኛ</button>
  </div>

  <div style="text-align:center; margin:20px 0 30px;">
    <div class="brand" style="font-size:28px;">On<span style="color:#2563eb;">hand</span></div>
    <p style="font-size:12px; color:var(--ink-soft); margin-top:4px;">በእጄ — In your hand</p>
    <p class="hint" style="margin-top:6px;" data-i18n="tagline"></p>
  </div>

  <div id="errorBox" style="background:#fee; color:#b00; padding:10px; border-radius:8px; margin-bottom:10px; display:none;"></div>

  <!-- SIGN IN -->
  <div class="tag-card" id="signInCard">
    <h2 class="section-title" style="margin-top:0;" data-i18n="signInTitle"></h2>
    <div class="field">
      <label for="siEmail" data-i18n="email"></label>
      <input type="email" id="siEmail" autocomplete="email">
    </div>
    <div class="field">
      <label for="siPassword" data-i18n="password"></label>
      <input type="password" id="siPassword" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="signInBtn" data-i18n="signInBtn"></button>
  </div>

  <p style="text-align:center; margin:22px 0;" id="toggleSignupRow">
    <button class="btn-link" id="toggleSignup" data-i18n="toggleToSignup"></button>
  </p>

  <!-- SIGN UP -->
  <div class="tag-card" id="signUpCard" style="display:none;">
    <h2 class="section-title" style="margin-top:0;" data-i18n="signUpTitle"></h2>
    <fieldset style="border:1px solid #ddd; border-radius:8px; padding:12px 14px; margin-bottom:16px;">
      <legend style="font-size:11px; text-transform:uppercase;" data-i18n="iAmA"></legend>
      <label><input type="radio" name="signupRole" value="owner" checked> <span data-i18n="shopOwner"></span></label><br>
      <label><input type="radio" name="signupRole" value="keeper"> <span data-i18n="keeperRole"></span></label>
    </fieldset>
    <div class="field">
      <label for="suName" data-i18n="yourName"></label>
      <input type="text" id="suName">
    </div>
    <div class="field" id="shopCodeField" style="display:none;">
      <label for="suShopCode" data-i18n="shopCode"></label>
      <input type="text" id="suShopCode" data-i18n-placeholder="shopCodePlaceholder">
    </div>
    <div class="field">
      <label for="suEmail" data-i18n="email"></label>
      <input type="email" id="suEmail" autocomplete="email">
    </div>
    <div class="field">
      <label for="suPassword" data-i18n="password"></label>
      <input type="password" id="suPassword" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="signUpBtn" data-i18n="signUpBtn"></button>
    <p id="suError" style="color:red; margin-top:10px; display:none;"></p>
  </div>

  <!-- SELF-HEAL -->
  <div class="tag-card" id="completeProfileCard" style="display:none;">
    <h2 class="section-title" style="margin-top:0;" data-i18n="finishSetupTitle"></h2>
    <p class="hint" data-i18n="finishSetupHint"></p>
    <fieldset style="border:1px solid #ddd; border-radius:8px; padding:12px 14px; margin-bottom:16px;">
      <legend style="font-size:11px; text-transform:uppercase;" data-i18n="iAmA"></legend>
      <label><input type="radio" name="fixRole" value="owner" checked> <span data-i18n="shopOwner"></span></label><br>
      <label><input type="radio" name="fixRole" value="keeper"> <span data-i18n="keeperRole"></span></label>
    </fieldset>
    <div class="field">
      <label for="fixName" data-i18n="yourName"></label>
      <input type="text" id="fixName">
    </div>
    <div class="field" id="fixShopCodeField" style="display:none;">
      <label for="fixShopCode" data-i18n="shopCode"></label>
      <input type="text" id="fixShopCode" data-i18n-placeholder="shopCodePlaceholder">
    </div>
    <button class="btn-primary" id="fixProfileBtn" data-i18n="saveContinue"></button>
    <p id="fixError" style="color:red; margin-top:10px; display:none;"></p>
    <p style="text-align:center; margin-top:14px;">
      <button id="fixSignOut" class="btn-link" data-i18n="notYouSignOut"></button>
    </p>
  </div>
</div>

<script src="supabaseClient.js"></script>
<script src="i18n.js"></script>
<script>
  (function() {
    const errorBox = document.getElementById('errorBox');
    function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
    function hideError() { errorBox.style.display = 'none'; }
    function hideAllCards() {
      document.getElementById('signInCard').style.display = 'none';
      document.getElementById('signUpCard').style.display = 'none';
      document.getElementById('completeProfileCard').style.display = 'none';
      document.getElementById('toggleSignupRow').style.display = 'none';
    }

    document.getElementById('toggleSignup').addEventListener('click', function() {
      const showing = document.getElementById('signUpCard').style.display !== 'none';
      document.getElementById('signUpCard').style.display = showing ? 'none' : 'block';
      document.getElementById('signInCard').style.display = showing ? 'block' : 'none';
      this.setAttribute('data-i18n', showing ? 'toggleToSignup' : 'toggleToSignin');
      applyTranslations();
      hideError();
    });

    document.querySelectorAll('input[name="signupRole"]').forEach(el => {
      el.addEventListener('change', function() {
        document.getElementById('shopCodeField').style.display =
          document.querySelector('input[name="signupRole"]:checked').value === 'keeper' ? 'block' : 'none';
      });
    });

    document.querySelectorAll('input[name="fixRole"]').forEach(el => {
      el.addEventListener('change', function() {
        document.getElementById('fixShopCodeField').style.display =
          document.querySelector('input[name="fixRole"]:checked').value === 'keeper' ? 'block' : 'none';
      });
    });

    async function saveProfile(userId, fullName, role, shopCode) {
      return supabase.from('profiles').upsert({
        id: userId,
        full_name: fullName,
        role: role,
        owner_id: role === 'keeper' ? shopCode : null
      });
    }

    function showCompleteProfileCard() {
      hideAllCards();
      document.getElementById('completeProfileCard').style.display = 'block';
    }

    document.getElementById('signInBtn').addEventListener('click', async function() {
      const email = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      hideError();
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { showError('Sign-in failed: ' + error.message); return; }

      const profile = await getCurrentProfile();
      if (!profile) { showCompleteProfileCard(); return; }
      window.location.href = profile.role === 'owner' ? 'owner.html' : 'keeper.html';
    });

    document.getElementById('signUpBtn').addEventListener('click', async function() {
      const role = document.querySelector('input[name="signupRole"]:checked').value;
      const fullName = document.getElementById('suName').value.trim();
      const shopCode = document.getElementById('suShopCode').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      const errEl = document.getElementById('suError');
      errEl.style.display = 'none';
      hideError();

      if (!fullName || !email || !password) {
        errEl.textContent = 'Please fill all fields.'; errEl.style.display = 'block'; return;
      }
      if (role === 'keeper' && !shopCode) {
        errEl.textContent = 'Please enter the shop code.'; errEl.style.display = 'block'; return;
      }

      try {
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { data: { full_name: fullName, role } }
        });
        if (error) { errEl.textContent = 'Sign-up error: ' + error.message; errEl.style.display = 'block'; return; }

        if (!data.session) {
          errEl.textContent = 'Account created — check your email to confirm, then sign in.';
          errEl.style.display = 'block';
          return;
        }

        const userId = data.session.user.id;
        const { error: profileError } = await saveProfile(userId, fullName, role, shopCode);
        if (profileError) {
          errEl.textContent = 'Profile save failed: ' + profileError.message;
          errEl.style.display = 'block';
          return;
        }

        window.location.href = role === 'owner' ? 'owner.html' : 'keeper.html';
      } catch (e) {
        errEl.textContent = 'Unexpected error: ' + e.message;
        errEl.style.display = 'block';
      }
    });

    document.getElementById('fixProfileBtn').addEventListener('click', async function() {
      const role = document.querySelector('input[name="fixRole"]:checked').value;
      const fullName = document.getElementById('fixName').value.trim();
      const shopCode = document.getElementById('fixShopCode').value.trim();
      const errEl = document.getElementById('fixError');
      errEl.style.display = 'none';

      if (!fullName) { errEl.textContent = 'Enter your name.'; errEl.style.display = 'block'; return; }
      if (role === 'keeper' && !shopCode) { errEl.textContent = 'Enter the shop code.'; errEl.style.display = 'block'; return; }

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { errEl.textContent = 'Session expired — please sign in again.'; errEl.style.display = 'block'; return; }

      const { error } = await saveProfile(user.id, fullName, role, shopCode);
      if (error) { errEl.textContent = 'Could not save: ' + error.message; errEl.style.display = 'block'; return; }

      window.location.href = role === 'owner' ? 'owner.html' : 'keeper.html';
    });

    document.getElementById('fixSignOut').addEventListener('click', async function() {
      await supabase.auth.signOut();
      window.location.reload();
    });

    (async function() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      const profile = await getCurrentProfile();
      if (profile) {
        window.location.href = profile.role === 'owner' ? 'owner.html' : 'keeper.html';
      } else {
        showCompleteProfileCard();
      }
    })();
  })();
</script>
</body>
</html>
