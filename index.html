<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duka — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="screen">

  <div style="text-align:center; margin:40px 0 30px;">
    <div class="brand" style="font-size:28px;">Duk<span>a</span></div>
    <p class="hint" style="margin-top:6px;">Track sales and stock, even when you're not there.</p>
  </div>

  <div class="tag-card" id="signInCard">
    <h2 class="section-title" style="margin-top:0;">Sign In</h2>
    <div class="field">
      <label for="siEmail">Email</label>
      <input type="email" id="siEmail" autocomplete="email">
    </div>
    <div class="field">
      <label for="siPassword">Password</label>
      <input type="password" id="siPassword" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="signInBtn">Sign In</button>
    <p id="siError" style="color:var(--bad); font-size:12.5px; margin-top:10px; display:none;"></p>
  </div>

  <p style="text-align:center; margin:22px 0;">
    <button class="btn-link" id="toggleSignup">New here? Create an account</button>
  </p>

  <div class="tag-card" id="signUpCard" style="display:none;">
    <h2 class="section-title" style="margin-top:0;">Create Account</h2>

    <fieldset style="border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:16px;">
      <legend style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:0 4px;">I am a...</legend>
      <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-top:8px; cursor:pointer;">
        <input type="radio" name="signupRole" value="owner" checked> Shop owner — setting up my shop
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-top:8px; cursor:pointer;">
        <input type="radio" name="signupRole" value="keeper"> Keeper — I have a shop code
      </label>
    </fieldset>

    <div class="field">
      <label for="suName">Your name</label>
      <input type="text" id="suName">
    </div>
    <div class="field" id="shopCodeField" style="display:none;">
      <label for="suShopCode">Shop code</label>
      <input type="text" id="suShopCode" placeholder="Ask the owner for this">
    </div>
    <div class="field">
      <label for="suEmail">Email</label>
      <input type="email" id="suEmail" autocomplete="email">
    </div>
    <div class="field">
      <label for="suPassword">Password</label>
      <input type="password" id="suPassword" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="signUpBtn">Create Account</button>
    <p id="suError" style="color:var(--bad); font-size:12.5px; margin-top:10px; display:none;"></p>
    <p id="suSuccess" style="color:var(--good); font-size:12.5px; margin-top:10px; display:none;"></p>
  </div>

</div>

<script src="supabaseClient.js"></script>
<script>
  (function() {
    // 1. Make sure supabase is available
    if (typeof supabase === 'undefined') {
      alert('Supabase client not loaded. Check your network or supabaseClient.js');
      return;
    }

    // 2. Toggle sign-in / sign-up
    const toggleSignup = document.getElementById('toggleSignup');
    const signInCard = document.getElementById('signInCard');
    const signUpCard = document.getElementById('signUpCard');
    toggleSignup.addEventListener('click', () => {
      const showingSignup = signUpCard.style.display !== 'none';
      signUpCard.style.display = showingSignup ? 'none' : 'block';
      signInCard.style.display = showingSignup ? 'block' : 'none';
      toggleSignup.textContent = showingSignup ? 'New here? Create an account' : 'Already have an account? Sign in';
    });

    // 3. Show/hide shop code field based on role
    document.querySelectorAll('input[name="signupRole"]').forEach(el => {
      el.addEventListener('change', () => {
        document.getElementById('shopCodeField').style.display =
          document.querySelector('input[name="signupRole"]:checked').value === 'keeper' ? 'block' : 'none';
      });
    });

    // 4. routeByRole – now uses window.getCurrentProfile (exposed in supabaseClient.js)
    async function routeByRole() {
      const profile = await getCurrentProfile();  // now globally available
      if (!profile) {
        // If no profile, maybe sign-in failed; stay on page
        console.warn('No profile found, staying on sign-in page.');
        return;
      }
      window.location.href = profile.role === 'owner' ? 'owner.html' : 'keeper.html';
    }

    // 5. Sign In
    document.getElementById('signInBtn').addEventListener('click', async () => {
      const email = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      const errEl = document.getElementById('siError');
      errEl.style.display = 'none';

      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
        await routeByRole();
      } catch (e) {
        errEl.textContent = 'Unexpected error: ' + e.message;
        errEl.style.display = 'block';
      }
    });

    // 6. Sign Up
    document.getElementById('signUpBtn').addEventListener('click', async () => {
      const role = document.querySelector('input[name="signupRole"]:checked').value;
      const fullName = document.getElementById('suName').value.trim();
      const shopCode = document.getElementById('suShopCode').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      const errEl = document.getElementById('suError');
      const okEl = document.getElementById('suSuccess');
      errEl.style.display = 'none'; okEl.style.display = 'none';

      if (!fullName || !email || !password) {
        errEl.textContent = 'Please fill in all fields.'; errEl.style.display = 'block'; return;
      }
      if (role === 'keeper' && !shopCode) {
        errEl.textContent = 'Ask your shop owner for the shop code.'; errEl.style.display = 'block'; return;
      }

      try {
        // Sign up
        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
        if (signUpError) { errEl.textContent = signUpError.message; errEl.style.display = 'block'; return; }

        const userId = signUpData.user?.id;
        if (!userId) {
          // Email confirmation required – show info
          okEl.textContent = 'Check your email to confirm your account, then sign in.';
          okEl.style.display = 'block';
          return;
        }

        // Insert profile
        const profileRow = {
          id: userId,
          full_name: fullName,
          role: role,
          owner_id: role === 'keeper' ? shopCode : null
        };
        const { error: profileError } = await supabase.from('profiles').insert(profileRow);
        if (profileError) {
          errEl.textContent = 'Account created, but shop code looked invalid: ' + profileError.message;
          errEl.style.display = 'block';
          return;
        }

        // Success – redirect
        await routeByRole();
      } catch (e) {
        errEl.textContent = 'Unexpected error: ' + e.message;
        errEl.style.display = 'block';
      }
    });

    // 7. If already signed in, go to the right dashboard
    (async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) await routeByRole();
      } catch (e) {
        console.warn('Session check failed:', e);
      }
    })();

  })();
</script>
</body>
</html>
