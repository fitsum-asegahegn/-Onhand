<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onhand — Scan & Sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-additions.css">
<link rel="stylesheet" href="responsive-desktop.css">
<link rel="stylesheet" href="layout-fixes.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Onhand">
<meta name="theme-color" content="#F7F3EA">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>
</head>
<body data-page="dashboard">
<div class="screen">

  <header style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);">
    <div>
      <div class="brand" style="font-size:26px; font-weight:700;"><span id="brandPart1">On</span><span id="brandPart2" style="color:#2563eb;">hand</span></div>
      <div style="font-size:10px; color:var(--ink-soft); letter-spacing:0.05em;" id="brandSubtitle">በእጄ</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="lang-toggle" id="langToggle" onclick="toggleLang()">አማርኛ</button>
      <span style="font-size:12px; text-transform:uppercase; color:var(--ink-soft);" data-i18n="keeperBadge"></span>
      <button onclick="signOut()" style="background:none; border:1px solid #ddd; padding:6px 14px; border-radius:6px; font-size:14px; cursor:pointer;" data-i18n="signOut"></button>
    </div>
  </header>

  <div id="offlineBanner" class="offline-banner">
    <span class="dot"></span>
    <span data-i18n="offlineBanner"></span>
    <span id="pendingCount"></span>
  </div>

  <button class="scan-button" id="startScanBtn">
    📷 <span data-i18n="scanProduct"></span>
    <span class="sub" data-i18n="tapToOpenCamera"></span>
  </button>

  <div id="reader" style="display:none; margin:10px 0;"></div>
  <div id="scanControls" style="display:none; gap:10px; margin-bottom:16px;">
    <button class="btn-secondary" id="stopScanBtn" style="flex:1;" data-i18n="cancelScan"></button>
    <button class="btn-secondary" id="torchBtn" style="flex:1; display:none;">💡 <span data-i18n="torch"></span></button>
  </div>

  <div class="tag-card" style="margin-bottom:16px;">
    <span class="tag-label" data-i18n="orTypeCode"></span>
    <p class="hint" style="margin:2px 0 10px;" data-i18n="scannerHint"></p>
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="text" id="manualBarcode" data-i18n-placeholder="typeCodePlaceholder" style="flex:1;">
      <button class="btn-primary" id="manualLookupBtn" style="flex:0 0 auto; width:auto; padding:12px 18px;" data-i18n="find"></button>
    </div>
    <div class="scanner-ready" id="scannerReadyDot" style="display:none;">
      <span class="dot"></span> <span id="scannerReadyText"></span>
    </div>
  </div>

  <details class="tag-card" style="margin-bottom:16px;" id="stockPanel">
    <summary style="cursor:pointer; font-weight:700; font-size:13px; font-family:var(--display); text-transform:uppercase; letter-spacing:.04em;" data-i18n="viewStockTitle"></summary>
    <div id="stockList" style="margin-top:12px;"><p class="hint">…</p></div>
  </details>

  <div class="tag-card" id="saleCard" style="display:none;">
    <span class="tag-label" data-i18n="selling"></span>
    <div class="tag-value" id="saleProductName" style="font-size:20px;">—</div>
    <div class="tag-sub" id="saleUnitPrice"></div>

    <div class="field" style="margin-top:14px;">
      <label for="saleQty" data-i18n="quantity"></label>
      <input type="number" id="saleQty" min="0.1" step="0.1" value="1">
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" id="cancelSaleBtn" style="flex:1;" data-i18n="cancel"></button>
      <button class="btn-primary" id="confirmSaleBtn" style="flex:1;" data-i18n="confirmSale"></button>
    </div>
  </div>

  <h2 class="section-title" data-i18n="itemNotFound"></h2>
  <p class="hint" data-i18n="itemNotFoundHint"></p>
  <div class="tag-card">
    <div class="field" style="margin-bottom:12px;">
      <label for="missedName" data-i18n="whatDidTheyAsk"></label>
      <input type="text" id="missedName" data-i18n-placeholder="missedSalePlaceholder">
    </div>
    <button class="btn-danger-outline" id="logMissedBtn" data-i18n="logMissedSale"></button>
  </div>

  <div id="toastArea"></div>
</div>

<script src="supabaseClient.js"></script>
<script src="i18n.js"></script>
<script src="offline.js"></script>
<script>
  let profile = null;
  let html5QrCode = null;
  let currentProduct = null;
  let torchOn = false;

  function showToast(msg, isError = false) {
    const area = document.getElementById('toastArea');
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function focusManualInput() {
    const input = document.getElementById('manualBarcode');
    if (document.getElementById('saleCard').style.display === 'none') {
      input.focus();
    }
  }

  async function refreshProductCache() {
    if (!navigator.onLine || !profile) return;
    try {
      const { data, error } = await supabase
        .from('products')
        .select('id, name, unit, selling_price, cost_price, current_stock, barcode')
        .eq('owner_id', profile.owner_id);
      if (error) throw error;
      cacheProducts(profile.owner_id, data || []);
      renderStockList(data || []);
    } catch (e) {
      console.warn('Could not refresh offline product cache', e);
      // still show something useful offline, from whatever was last cached
      renderStockList(getCachedProducts(profile.owner_id));
    }
  }

  // Deliberately excludes cost_price — this is the same list the keeper
  // can already see mid-sale (name, unit, stock, selling price), just
  // browsable up front so they can answer "do we have more sugar?"
  // without needing to scan anything.
  function renderStockList(products) {
    const el = document.getElementById('stockList');
    if (!products.length) {
      el.innerHTML = '<p class="empty-state">…</p>';
      return;
    }
    const sorted = [...products].sort((a, b) => a.name.localeCompare(b.name));
    el.innerHTML = sorted.map(p => {
      const d = document.createElement('div');
      d.textContent = p.name;
      const safeName = d.innerHTML;
      return `
        <div class="product-row">
          <div>
            <div class="name">${safeName}</div>
            <div class="meta">${Math.round(p.selling_price)} Birr · ${p.unit}</div>
          </div>
          <span class="stock-flag ok">${p.current_stock} ${p.unit}</span>
        </div>`;
    }).join('');
  }

  async function lookupProduct(barcode) {
    const code = barcode.trim();
    if (navigator.onLine) {
      try {
        const { data, error } = await supabase
          .from('products')
          .select('id, name, unit, selling_price, cost_price, current_stock')
          .eq('owner_id', profile.owner_id)
          .eq('barcode', code)
          .maybeSingle();
        if (error) throw error;
        if (data) return data;
        return null;
      } catch (e) {
        console.warn('Live lookup failed, trying offline cache', e);
      }
    }
    const cached = getCachedProducts(profile.owner_id);
    return cached.find(p => p.barcode === code) || null;
  }

  function openSaleCard(product) {
    currentProduct = product;
    document.getElementById('saleProductName').textContent = product.name;
    document.getElementById('saleUnitPrice').textContent =
      Math.round(product.selling_price) + ' Birr · ' + product.unit + ' · ' + product.current_stock + ' ' + t('inStock');
    document.getElementById('saleQty').value = 1;
    document.getElementById('saleCard').style.display = 'block';
  }

  function closeSaleCard() {
    currentProduct = null;
    document.getElementById('saleCard').style.display = 'none';
    focusManualInput();
  }

  async function onScanSuccess(decodedText) {
    await stopScanner();
    const product = await lookupProduct(decodedText);
    if (!product) { showToast(t('barcodeNotFound'), true); return; }
    openSaleCard(product);
  }

  async function startScanner() {
    try {
      document.getElementById('reader').style.display = 'block';
      document.getElementById('scanControls').style.display = 'flex';
      document.getElementById('startScanBtn').style.display = 'none';

      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ],
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });

      await html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 15,
          qrbox: function(viewfinderWidth) {
            var w = Math.floor(Math.min(viewfinderWidth * 0.85, 380));
            return { width: w, height: Math.floor(w * 0.45) };
          }
        },
        onScanSuccess
      );

      try {
        var capabilities = html5QrCode.getRunningTrackCapabilities();
        if (capabilities && capabilities.torch) {
          document.getElementById('torchBtn').style.display = 'block';
        }
      } catch (e) { /* not supported — fine */ }

    } catch (e) {
      showToast(t('couldNotOpenCamera'), true);
      await stopScanner();
    }
  }

  document.getElementById('torchBtn').addEventListener('click', async () => {
    if (!html5QrCode) return;
    try {
      torchOn = !torchOn;
      await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    } catch (e) {
      showToast(t('torchNotAvailable'), true);
    }
  });

  async function stopScanner() {
    if (html5QrCode) {
      try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
      html5QrCode = null;
    }
    torchOn = false;
    document.getElementById('reader').style.display = 'none';
    document.getElementById('scanControls').style.display = 'none';
    document.getElementById('torchBtn').style.display = 'none';
    document.getElementById('startScanBtn').style.display = 'block';
    focusManualInput();
  }

  document.getElementById('manualLookupBtn').addEventListener('click', async () => {
    const code = document.getElementById('manualBarcode').value.trim();
    if (!code) { showToast(t('enterBarcode'), true); return; }
    const product = await lookupProduct(code);
    if (!product) { showToast(t('barcodeNotFound'), true); return; }
    document.getElementById('manualBarcode').value = '';
    openSaleCard(product);
  });
  document.getElementById('manualBarcode').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('manualLookupBtn').click(); }
  });

  document.getElementById('startScanBtn').addEventListener('click', startScanner);
  document.getElementById('stopScanBtn').addEventListener('click', stopScanner);
  document.getElementById('cancelSaleBtn').addEventListener('click', closeSaleCard);

  document.getElementById('confirmSaleBtn').addEventListener('click', async () => {
    if (!currentProduct) return;
    const qty = parseFloat(document.getElementById('saleQty').value);
    if (!qty || qty <= 0) { showToast(t('enterValidQuantity'), true); return; }

    // Guard against double-tap: on a slow connection it's easy to tap
    // Confirm Sale twice before the first request finishes, which was a
    // real source of duplicate sales (and stock dropping further than
    // it should have).
    const btn = document.getElementById('confirmSaleBtn');
    if (btn.disabled) return;
    btn.disabled = true;

    const salePayload = {
      owner_id: profile.owner_id,
      product_id: currentProduct.id,
      sold_by: profile.id,
      quantity: qty,
      unit_price_at_sale: currentProduct.selling_price,
      cost_price_at_sale: currentProduct.cost_price
    };

    if (navigator.onLine) {
      try {
        const { error } = await supabase.from('sales').insert(salePayload);
        if (error) throw error;
        showToast('✅ ' + t('saleRecorded') + ': ' + qty + ' ' + currentProduct.unit + ' — ' + currentProduct.name);
        closeSaleCard();
        btn.disabled = false;
        return;
      } catch (e) {
        console.warn('Live sale insert failed, queueing offline', e);
      }
    }

    queueWrite('sales', salePayload);
    showToast('📦 ' + t('saleQueuedOffline') + ': ' + qty + ' ' + currentProduct.unit + ' — ' + currentProduct.name);
    closeSaleCard();
    btn.disabled = false;
  });

  document.getElementById('logMissedBtn').addEventListener('click', async () => {
    const name = document.getElementById('missedName').value.trim();
    if (!name) { showToast(t('enterMissedItem'), true); return; }

    const payload = {
      owner_id: profile.owner_id,
      product_name_free_text: name,
      reported_by: profile.id
    };

    if (navigator.onLine) {
      try {
        const { error } = await supabase.from('missed_sales').insert(payload);
        if (error) throw error;
        document.getElementById('missedName').value = '';
        showToast('📝 ' + t('missedLogged'));
        return;
      } catch (e) {
        console.warn('Live missed-sale insert failed, queueing offline', e);
      }
    }

    queueWrite('missed_sales', payload);
    document.getElementById('missedName').value = '';
    showToast('📦 ' + t('missedQueuedOffline'));
  });

  (async () => {
    profile = await requireRole('keeper');
    if (!profile) return;

    if (!profile.owner_id) {
      document.querySelector('.screen').innerHTML =
        '<div style="padding:40px; text-align:center; color:red;">' +
        '<p>⚠️ ' + t('notLinkedTitle') + '</p>' +
        '<p>' + t('notLinkedBody') + '</p>' +
        '<button onclick="signOut()" class="btn-primary" style="margin-top:20px;">' + t('signOut') + '</button>' +
        '</div>';
      return;
    }

    await refreshProductCache();
    setInterval(refreshProductCache, 5 * 60 * 1000);

    document.getElementById('scannerReadyDot').style.display = 'inline-flex';
    document.getElementById('scannerReadyText').textContent =
      currentLang === 'am' ? 'ለስካን ዝግጁ' : 'Ready for scanner input';
    focusManualInput();
  })();
</script>
</body>
</html>
